# =============================================================================
# 4GUARD WMS — Docker Compose Fullstack (BD + BE + FE Admin & Tablet)
# Optimizado para servidores Hetzner compartidos con aplicaciones en producción.
# Consumo total en ejecución: ~400MB - 550MB de RAM (Límite estricto: < 750MB).
# =============================================================================

services:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. BASE DE DATOS (PostgreSQL 16 Alpine — Sintonizada para ultra-bajo consumo)
  # Consumo típico en RAM: ~80MB - 110MB
  # ───────────────────────────────────────────────────────────────────────────
  4guard-db:
    image: postgres:16-alpine
    container_name: 4guard-db
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c effective_cache_size=64MB
    environment:
      POSTGRES_DB: 4guard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin_password_4guard
    volumes:
      - 4guard_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 200M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 4guard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # 2. BACKEND (Spring Boot 3.x / Java 17 — JVM optimizada con SerialGC)
  # Consumo típico en RAM: ~250MB - 320MB
  # ───────────────────────────────────────────────────────────────────────────
  4guard-backend:
    build:
      context: ./4guard_be
      dockerfile: Dockerfile
    container_name: 4guard-backend
    restart: unless-stopped
    depends_on:
      4guard-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://4guard-db:5432/4guard_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin_password_4guard
      SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS: "*"
      # JVM optimizada: SerialGC, heap acotado a 200MB, metaspace 140MB
      JAVA_OPTS: "-Xms64m -Xmx200m -Xss256k -XX:+UseSerialGC -XX:MaxMetaspaceSize=140m -XX:ReservedCodeCacheSize=40m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 450M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/health || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s

  # ───────────────────────────────────────────────────────────────────────────
  # 3. FRONTEND (Nginx Alpine — Sirve Admin Console y Terminal RF en simultáneo)
  # Consumo típico en RAM: ~15MB
  # ───────────────────────────────────────────────────────────────────────────
  4guard-frontend:
    build:
      context: ./4Guard_FE_UI
      dockerfile: Dockerfile
    container_name: 4guard-frontend
    restart: unless-stopped
    depends_on:
      - 4guard-backend
    volumes:
      - ./4Guard_FE_UI/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Puertos Host : Puertos Contenedor (No interfieren con puertos 80/443 de tu app de producción)
      - "8081:8080" # Consola Web Admin → http://<TU_IP_HETZNER>:8081
      - "8082:8081" # Terminal RF Tablet → http://<TU_IP_HETZNER>:8082
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 80M
        reservations:
          memory: 20M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  4guard_pgdata:
    driver: local
